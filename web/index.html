    <!-- splash:style:start -->
    <style>
      html { background: #fbf7f8; }
      @media (prefers-color-scheme: dark) { html { background: #141113; } }
      #splash {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #b0154f;
        transition: opacity 0.35s ease, visibility 0.35s;
      }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash .splash-mark { width: min(54vw, 260px); height: auto; fill: #fff; filter: drop-shadow(0 6px 14px rgb(61 0 25 / 0.35)); }
      #splash .splash-dots { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 15vh); display: flex; justify-content: center; gap: 8px; opacity: 0; animation: splash-in 0.3s 0.9s forwards; }
      #splash .splash-dots i { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: 0.4; animation: splash-dot 1s infinite; }
      #splash .splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #splash .splash-dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-in { to { opacity: 1; } }
      @keyframes splash-dot { 40% { opacity: 1; transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) { #splash, #splash * { animation-duration: 0s !important; transition: none !important; } }
    </style>
